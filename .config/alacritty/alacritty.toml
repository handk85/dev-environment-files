[env]
TERM = "xterm-256color"

[font]
size = 19.0

[font.bold]
family = "MesloLGS Nerd Font"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "MesloLGS Nerd Font"

[font.normal]
family = "MesloLGS Nerd Font"

[font.offset]
x = 0
y = 0

[window]
decorations = "buttonless"
opacity = 0.95

[window.dimensions]
columns = 110
lines = 33

[window.padding]
x = 0
y = 0

[colors]
draw_bold_text_with_bright_colors = true
